name: Build fpcalc

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "build.yml"
      - "packages/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "build.yml"
      - "packages/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.variables.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup variables
        id: variables
        shell: bash
        run: |
          source packages/common.sh

          version="${CHROMAPRINT_VERSION#v}"

          if [[ $version =~ ^[0-9]+\.[0-9]+$ ]]; then
            version="${version}.0"
          fi

          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Display version
        run: echo ${{ steps.variables.outputs.version }}

  build_linux:
    runs-on: ${{ startsWith(matrix.architecture, 'arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache ffmpeg build artifacts
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ffmpeg/artifacts
          key: ${{ runner.os }}-ffmpeg-linux-${{ matrix.architecture }}-${{ hashFiles('packages/common.sh', 'packages/ffmpeg/build-linux.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: docker://mirror.gcr.io/debian:13.6
        env:
          ARCH: ${{ matrix.architecture }}
        with:
          args: /bin/sh -c "export DEBIAN_FRONTEND=noninteractive; apt-get update && apt-get upgrade --yes && apt-get install --yes --no-install-suggests --no-install-recommends ca-certificates curl build-essential pkg-config nasm gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross && ./packages/ffmpeg/build-linux.sh"

      - name: Display build information
        run: |
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg -hide_banner -version
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg -hide_banner -buildconf
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg -hide_banner -demuxers
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg -hide_banner -decoders

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-linux-${{ matrix.architecture }}
          path: packages/ffmpeg/artifacts/
          if-no-files-found: error

      - name: Build chromaprint
        uses: docker://mirror.gcr.io/debian:13.6
        env:
          ARCH: ${{ matrix.architecture }}
        with:
          args: /bin/sh -c "export DEBIAN_FRONTEND=noninteractive; apt-get update && apt-get upgrade --yes && apt-get install --yes --no-install-suggests --no-install-recommends ca-certificates curl build-essential cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross && ./packages/chromaprint/build-linux.sh"

      - name: Display build information
        run: |
          file packages/chromaprint/artifacts/opt/chromaprint/bin/fpcalc
          packages/chromaprint/artifacts/opt/chromaprint/bin/fpcalc -version || true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpcalc-linux-${{ matrix.architecture }}
          path: packages/chromaprint/artifacts/opt/chromaprint/bin
          if-no-files-found: error

  build_mac:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache ffmpeg build artifacts
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ffmpeg/artifacts
          key: ${{ runner.os }}-ffmpeg-macos-${{ matrix.architecture }}-${{ hashFiles('packages/common.sh', 'packages/ffmpeg/build-mac.sh') }}

      - name: Install dependencies
        run: |
          brew trust aws/tap
          brew install nasm

      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          ARCH: ${{ matrix.architecture }}
        run: ./packages/ffmpeg/build-mac.sh

      - name: Display build information
        run: |
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg -hide_banner -version
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg -hide_banner -buildconf
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg -hide_banner -demuxers
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg -hide_banner -decoders

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-macos-${{ matrix.architecture }}
          path: packages/ffmpeg/artifacts/
          if-no-files-found: error

      - name: Build chromaprint
        env:
          ARCH: ${{ matrix.architecture }}
        run: ./packages/chromaprint/build-mac.sh

      - name: Display build information
        run: |
          otool -L packages/chromaprint/artifacts/opt/chromaprint/bin/fpcalc
          otool -l packages/chromaprint/artifacts/opt/chromaprint/bin/fpcalc
          packages/chromaprint/artifacts/opt/chromaprint/bin/fpcalc -version || true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpcalc-macos-${{ matrix.architecture }}
          path: packages/chromaprint/artifacts/opt/chromaprint/bin
          if-no-files-found: error

  build_windows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        architecture:
          - x86
          - x64
        include:
#          - architecture: x64
#            os: windows-latest
#            msystem: CLANG64
          - architecture: arm64
            os: windows-11-arm
            msystem: CLANGARM64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache ffmpeg build artifacts
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ffmpeg/artifacts
          key: ${{ runner.os }}-ffmpeg-windows-${{ matrix.architecture }}-${{ hashFiles('packages/common.sh', 'packages/ffmpeg/build-windows.sh') }}

      - name: Build ffmpeg (gcc)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        uses: docker://mirror.gcr.io/debian:13.6
        env:
          ARCH: ${{ matrix.architecture }}
        with:
          args: /bin/sh -c "export DEBIAN_FRONTEND=noninteractive; apt-get update && apt-get upgrade --yes && apt-get install --yes --no-install-suggests --no-install-recommends ca-certificates curl build-essential pkg-config gcc-mingw-w64 g++-mingw-w64 nasm && ./packages/ffmpeg/build-windows.sh"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            curl
            make
            pkgconf
            diffutils
          pacboy: >-
            clang:p
            gcc:p
            cmake:p
            nasm:p

      - name: Build ffmpeg (clang)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        env:
          ARCH: ${{ matrix.architecture }}
        run: msys2 -c './packages/ffmpeg/build-windows.sh'

      - name: Display build information
        if: runner.os == 'Windows'
        shell: bash
        run: |
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg.exe -hide_banner -version
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg.exe -hide_banner -buildconf
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg.exe -hide_banner -demuxers
          packages/ffmpeg/artifacts/ffmpeg-*/opt/ffmpeg/bin/ffmpeg.exe -hide_banner -decoders

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows-${{ matrix.architecture }}
          path: packages/ffmpeg/artifacts/
          if-no-files-found: error

      - name: Build chromaprint (gcc)
        uses: docker://mirror.gcr.io/debian:13.6
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.architecture }}
        with:
          args: /bin/sh -c "export DEBIAN_FRONTEND=noninteractive; apt-get update && apt-get upgrade --yes && apt-get install --yes --no-install-suggests --no-install-recommends ca-certificates curl build-essential cmake gcc-mingw-w64 g++-mingw-w64 && ./packages/chromaprint/build-windows.sh"

      - name: Build chromaprint (clang)
        if: runner.os == 'Windows'
        env:
          ARCH: ${{ matrix.architecture }}
        run: msys2 -c './packages/chromaprint/build-windows.sh'

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpcalc-windows-${{ matrix.architecture }}
          path: packages/chromaprint/artifacts/opt/chromaprint/bin
          if-no-files-found: error

  package:
    needs:
      - prepare
      - build_linux
      - build_mac
      - build_windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
        with:
          dotnet-version: '10.0.x'

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fpcalc-*
          path: artifacts
          merge-multiple: false

      - name: List artifacts
        run: ls -lR artifacts

      - name: Package
        shell: bash
        run: dotnet pack -c Release -p:Version=${{ needs.prepare.outputs.semver }}.${{ github.run_number }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/package/release/Openur.ChromaprintStatic.*.nupkg
          if-no-files-found: error

  release:
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fpcalc-*
          path: artifacts
          merge-multiple: false

      - name: Archive artifacts
        run: |
          mkdir artifacts/release/
          cd artifacts/
          for dir in fpcalc-*; do
            name=$(basename $dir)
            tar -cJf release/$name.tar.xz -C $(dirname $dir) $name
          done
          ls -lha release/

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: |
            packages/Openur.ChromaprintStatic.*.nupkg
            artifacts/release/fpcalc-*
          artifactErrorsFailBuild: true
          draft: false
          generateReleaseNotes: true
          skipIfReleaseExists: true
          immutableCreate: true
          name: v${{ needs.prepare.outputs.semver }} (build ${{ github.run_number }})
          tag: v${{ needs.prepare.outputs.semver }}.${{ github.run_number }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - name: Push to GitHub
        shell: bash
        run: >-
          dotnet
          nuget
          push
          packages/Openur.ChromaprintStatic.*.nupkg
          --no-symbols
          --skip-duplicate
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: NuGet login
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: Openur

      - name: Push to NuGet
        shell: bash
        run: >-
          dotnet
          nuget
          push
          packages/Openur.ChromaprintStatic.*.nupkg
          --no-symbols
          --skip-duplicate
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
